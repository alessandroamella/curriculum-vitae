name: Release PDFs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer
        run: npm install --no-save puppeteer@23

      - name: Print CVs to PDF
        run: node scripts/html-to-pdf.mjs dist

      - name: Set release tag
        id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CV ${{ steps.tag.outputs.tag }}
          body: |
            PDFs generated from ${{ github.sha }}.
          files: dist/*.pdf
